name: Reconcile upstream with latest fork GPT-6

on:
  push:
    branches: [feat/upstream-v5-gpt6-macos]
    paths:
      - .integration/reconcile-main.py
      - .github/workflows/fork-reconcile-validation.yml

permissions:
  contents: read

env:
  FORK_MAIN: c2de3fa39bf30ce86e4d42caba57fce838df51a6
  UPSTREAM: 184b1d69b764982f9a34dce127d5f4d826afa9d8

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconcile pinned source trees without modifying remote branches
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp .integration/reconcile-main.py "$RUNNER_TEMP/reconcile-main.py"
          cp .github/workflows/fork-reconcile-validation.yml "$RUNNER_TEMP/fork-reconcile-validation.yml"
          git checkout --detach "$FORK_MAIN"
          git merge --no-commit --no-ff "$UPSTREAM" || test -f .git/MERGE_HEAD
          python3 "$RUNNER_TEMP/reconcile-main.py"
          cp "$RUNNER_TEMP/fork-reconcile-validation.yml" .github/workflows/fork-reconcile-validation.yml
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check
          git write-tree > "$RUNNER_TEMP/tree-sha.txt"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: launcher
      - name: Full verification
        run: |
          set -o pipefail
          bun run verify 2>&1 | tee "$RUNNER_TEMP/verification.log"
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reconciled-${{ matrix.os }}
          retention-days: 3
          path: |
            ${{ runner.temp }}/tree-sha.txt
            ${{ runner.temp }}/verification.log

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: reconciled-*
          path: /tmp/reconciled-validation
      - name: Publish the identical validated tree with both fork histories
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp .integration/reconcile-main.py "$RUNNER_TEMP/reconcile-main.py"
          cp .github/workflows/fork-reconcile-validation.yml "$RUNNER_TEMP/fork-reconcile-validation.yml"
          git checkout --detach "$FORK_MAIN"
          git merge --no-commit --no-ff "$UPSTREAM" || test -f .git/MERGE_HEAD
          python3 "$RUNNER_TEMP/reconcile-main.py"
          cp "$RUNNER_TEMP/fork-reconcile-validation.yml" .github/workflows/fork-reconcile-validation.yml
          git add -A
          git diff --cached --check
          TREE="$(git write-tree)"
          test "$TREE" = "$(cat /tmp/reconciled-validation/reconciled-ubuntu-latest/tree-sha.txt)"
          test "$TREE" = "$(cat /tmp/reconciled-validation/reconciled-macos-15/tree-sha.txt)"
          # Workflow contents were authorized in the parent commit and remain unchanged here.
          test "$(git rev-parse "$GITHUB_SHA:.github")" = "$(git rev-parse "$TREE:.github")"
          COMMIT="$(git commit-tree "$TREE" -p "$GITHUB_SHA" -p "$FORK_MAIN" -m 'fix: reconcile upstream v5 with merged GPT-6 Pro and preserve Mac fixes')"
          echo "Validated merge commit: $COMMIT"
          git push origin "$COMMIT:refs/heads/feat/upstream-v5-gpt6-macos"
