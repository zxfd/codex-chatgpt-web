name: GPT-6 focused validation

on:
  push:
    branches: [feat/gpt6-web-model-selection]
    paths:
      - .github/workflows/gpt6-validation.yml
      - .gpt6-change.patch

permissions:
  contents: write

concurrency:
  group: gpt6-focused-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Apply reviewed source patch when present
        id: patch
        shell: bash
        run: |
          if test -f .gpt6-change.patch; then
            git apply --check .gpt6-change.patch
            git apply .gpt6-change.patch
            rm .gpt6-change.patch
            echo 'applied=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: oven-sh/setup-bun@v2
        if: steps.patch.outputs.applied == 'true'
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        if: steps.patch.outputs.applied == 'true'
        run: |
          bun install --frozen-lockfile
          cd launcher && bun install --frozen-lockfile
      - name: Typecheck and run regression tests
        if: steps.patch.outputs.applied == 'true'
        run: |
          set -o pipefail
          { bun run typecheck && bun test tests/*.test.ts && bun run launcher:typecheck && bun run launcher:test && bun run launcher:build; } 2>&1 | tee "$RUNNER_TEMP/validation.log"
      - name: Commit validated changes on the feature branch only
        if: steps.patch.outputs.applied == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: support explicit GPT-6 Pro web routing and filter local Luna/Terra models'
          git push origin HEAD:refs/heads/feat/gpt6-web-model-selection
      - name: Export source and validation results
        if: always()
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=launcher/node_modules --exclude=dist --exclude=launcher/dist --exclude=launcher/artifacts --exclude=launcher/out -czf "$RUNNER_TEMP/gpt6-source.tar.gz" .
          git status --short > "$RUNNER_TEMP/git-status.txt"
          git rev-parse HEAD > "$RUNNER_TEMP/commit.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gpt6-validation-workspace
          retention-days: 3
          path: |
            ${{ runner.temp }}/gpt6-source.tar.gz
            ${{ runner.temp }}/validation.log
            ${{ runner.temp }}/git-status.txt
            ${{ runner.temp }}/commit.txt
